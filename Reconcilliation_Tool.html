<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Excel & PDF Matcher Dashboard</title>
    
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Material UI -->
    <script crossorigin src="https://unpkg.com/@mui/material@5.15.11/umd/material-ui.production.min.js"></script>
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <!-- Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        body { margin: 0; padding: 0; background-color: #f4f6f8; font-family: 'Roboto', sans-serif; }
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; }
        ::-webkit-scrollbar-thumb { background: #c1c1c1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #a8a8a8; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        // Lucide Icon Wrapper for React
        const Icon = ({ name, size = 24, color = 'currentColor', ...props }) => {
            const iconRef = React.useRef(null);
            React.useEffect(() => {
                if (iconRef.current) {
                    iconRef.current.innerHTML = '';
                    lucide.createIcons({ icons: { [name]: lucide.icons[name] }, root: iconRef.current, attrs: { width: size, height: size, stroke: color } });
                }
            }, [name, size, color]);
            return <span ref={iconRef} style={{ display: 'inline-flex', alignItems: 'center', justifyContent: 'center' }} {...props} />;
        };

        const { useState, useCallback, useRef, useEffect, useMemo } = React;
        const {
            Select, MenuItem, InputLabel, Checkbox, ListItemText, OutlinedInput,
            Chip, createTheme, ThemeProvider, CssBaseline, Box, Container, Typography,
            Paper, Grid, Button, IconButton, FormControl, TextField, CircularProgress,
            TableContainer, Table, TableHead, TableRow, TableCell, TableBody, Tooltip,
            Snackbar, Dialog, DialogTitle, DialogContent, DialogActions, List, ListItem
        } = MaterialUI;

        const theme = createTheme({
            palette: { primary: { main: '#2e7d32' }, secondary: { main: '#1976d2' }, background: { default: '#f4f6f8' } },
            typography: { fontFamily: 'Roboto, Arial, sans-serif' },
        });

        // Modules
        const DEFAULT_MODULES = [
            { id: 'mod_1', name: 'Remove Symbols ($,)', code: 'return value.replace(/[$,]/g, "");' },
            { id: 'mod_2', name: 'Scale by 1000', code: 'const num = Number(value.replace(/[$,]/g, "")); return isNaN(num) ? value : (num / 1000).toString();' },
            { id: 'mod_3', name: 'Format 2 Decimals', code: 'const num = Number(value.replace(/[$,]/g, "")); return isNaN(num) ? value : num.toLocaleString("en-US", {minimumFractionDigits: 2, maximumFractionDigits: 2});' },
            { id: 'mod_4', name: 'Date: DD-MM-YYYY to DD-Mon-YY', code: 'const parts = value.split("-"); if(parts.length!==3) return value; const months = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"]; return `${parts[0]}-${months[parseInt(parts[1])-1]}-${parts[2].slice(-2)}`;' },
            { id: 'mod_5', name: 'Extract First Word', code: 'return value.split(" ")[0];' }
        ];

        const useFormattingModules = () => {
            const [modules, setModules] = useState(() => {
                try {
                    const saved = localStorage.getItem('pdf_matcher_modules');
                    return saved ? JSON.parse(saved) : DEFAULT_MODULES;
                } catch (e) { return DEFAULT_MODULES; }
            });
            useEffect(() => { localStorage.setItem('pdf_matcher_modules', JSON.stringify(modules)); }, [modules]);
            const addModule = (newModule) => setModules(prev => [...prev, { ...newModule, id: `mod_custom_${Date.now()}` }]);
            const deleteModule = (id) => setModules(prev => prev.filter(m => m.id !== id));
            const exportModules = () => {
                const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(modules));
                const downloadAnchorNode = document.createElement('a');
                downloadAnchorNode.setAttribute("href", dataStr);
                downloadAnchorNode.setAttribute("download", "formatting_modules.json");
                document.body.appendChild(downloadAnchorNode); downloadAnchorNode.click(); downloadAnchorNode.remove();
            };
            const importModules = (event) => {
                const file = event.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = (e) => {
                    try { const imported = JSON.parse(e.target.result); if (Array.isArray(imported)) setModules(imported); } 
                    catch (err) { alert("Invalid module file"); }
                };
                reader.readAsText(file);
            };
            return { modules, addModule, deleteModule, exportModules, importModules };
        };

        const useScript = (url) => {
            const [loaded, setLoaded] = useState(false);
            const [error, setError] = useState(false);
            useEffect(() => {
                if (!url) return;
                if (url.includes('xlsx') && window.XLSX) { setLoaded(true); return; }
                if (url.includes('pdf.js') && window.pdfjsLib) { setLoaded(true); return; }
                if (url.includes('pdf-lib') && window.PDFLib) { setLoaded(true); return; }
                const script = document.createElement('script');
                script.src = url; script.async = true;
                script.onload = () => setLoaded(true);
                script.onerror = () => setError(true);
                document.body.appendChild(script);
                return () => document.body.removeChild(script);
            }, [url]);
            return { loaded, error };
        };

        const useExcelUploader = (xlsxLoaded) => {
            const [workbook, setWorkbook] = useState(null);
            const [sheetNames, setSheetNames] = useState([]);
            const [fileName, setFileName] = useState('');
            const [error, setError] = useState(null);
            const [loading, setLoading] = useState(false);
            const handleFileUpload = useCallback(async (event) => {
                if (!xlsxLoaded || !window.XLSX) { setError("Excel library not loaded."); return; }
                const file = event.target.files[0];
                if (!file) return;
                setLoading(true); setError(null); setFileName(file.name); setWorkbook(null); setSheetNames([]);
                try {
                    const data = await file.arrayBuffer();
                    const wb = window.XLSX.read(data, { type: 'array' });
                    setWorkbook(wb); setSheetNames(wb.SheetNames || []);
                } catch (err) { setError("Failed to read Excel file."); setFileName(''); } 
                finally { setLoading(false); if (event.target) event.target.value = null; }
            }, [xlsxLoaded]);
            const resetUpload = useCallback(() => { setWorkbook(null); setSheetNames([]); setFileName(''); setError(null); setLoading(false); }, []);
            return { workbook, sheetNames, fileName, error, loading, handleFileUpload, resetUpload, setError };
        };

        const useSheetData = (workbook, selectedSheetName) => {
            const [suggestedRange, setSuggestedRange] = useState('');
            const [customRange, setCustomRange] = useState('');
            const [headers, setHeaders] = useState([]);
            const [rows, setRows] = useState([]);
            const [error, setError] = useState(null);
            const extractDataFromRange = useCallback((sheet, rangeStr) => {
                if (!window.XLSX) return { extractedHeaders: [], extractedRows: [] };
                try {
                    const jsonData = window.XLSX.utils.sheet_to_json(sheet, { range: rangeStr || sheet['!ref'], header: 1, defval: "", raw: false });
                    if (!jsonData || jsonData.length === 0) return { extractedHeaders: [], extractedRows: [] };
                    const rawHeaders = jsonData[0];
                    const extractedHeaders = rawHeaders.map((headerText, index) => ({ id: `col_${index}`, label: String(headerText || `Column ${index + 1}`), colIndex: index }));
                    const extractedRows = jsonData.slice(1).map((rowArray, rowIndex) => {
                        const rowData = { id: `row_${rowIndex}` }; 
                        extractedHeaders.forEach((header, index) => { rowData[header.id] = String(rowArray[index] !== undefined && rowArray[index] !== null ? rowArray[index] : ""); });
                        return rowData;
                    });
                    return { extractedHeaders, extractedRows };
                } catch (err) { setError("Invalid range."); return { extractedHeaders: [], extractedRows: [] }; }
            }, []);

            useEffect(() => {
                if (!workbook || !selectedSheetName) { setSuggestedRange(''); setCustomRange(''); setHeaders([]); setRows([]); setError(null); return; }
                try {
                    const sheet = workbook.Sheets[selectedSheetName];
                    if (!sheet) return setError("Sheet not found.");
                    const sheetRef = sheet['!ref'];
                    if (sheetRef) { setSuggestedRange(sheetRef); setCustomRange(sheetRef); setError(null); } else setError("Sheet is empty.");
                } catch (err) { setError("Error analyzing sheet."); }
            }, [workbook, selectedSheetName]);

            useEffect(() => {
                if (!workbook || !selectedSheetName || !customRange) { setHeaders([]); setRows([]); return; }
                const sheet = workbook.Sheets[selectedSheetName];
                if (sheet) {
                    const { extractedHeaders, extractedRows } = extractDataFromRange(sheet, customRange);
                    setHeaders(extractedHeaders); setRows(extractedRows);
                }
            }, [workbook, selectedSheetName, customRange, extractDataFromRange]);

            const handleRangeChange = (newRange) => { setCustomRange(newRange.toUpperCase()); setError(null); };
            return { suggestedRange, customRange, headers, rows, handleRangeChange, error, setCustomRange };
        };

        const useFilteredData = (rows, filters) => {
            return useMemo(() => {
                const activeFilters = Object.entries(filters).filter(([_, value]) => value.trim() !== '');
                if (activeFilters.length === 0) return rows;
                return rows.filter(row => activeFilters.every(([colId, filterValue]) => String(row[colId] || "").toLowerCase().includes(filterValue.toLowerCase().trim())));
            }, [rows, filters]);
        };

        const useHeaderSelection = () => {
            const [selectedHeaderIds, setSelectedHeaderIds] = useState([]);
            const [headerPipelines, setHeaderPipelines] = useState({});
            const handleHeaderSelectionChange = (event) => setSelectedHeaderIds(typeof event.target.value === 'string' ? event.target.value.split(',') : event.target.value);
            const addModuleToPipeline = (colId, moduleId) => setHeaderPipelines(prev => ({ ...prev, [colId]: [...(prev[colId] || []), moduleId] }));
            const removeModuleFromPipeline = (colId, indexToRemove) => setHeaderPipelines(prev => ({ ...prev, [colId]: (prev[colId] || []).filter((_, index) => index !== indexToRemove) }));
            return { selectedHeaderIds, handleHeaderSelectionChange, headerPipelines, addModuleToPipeline, removeModuleFromPipeline };
        };

        const usePdfUploader = (pdfLoaded) => {
            const [pdfData, setPdfData] = useState(null);
            const [pdfFileName, setPdfFileName] = useState('');
            const [error, setError] = useState(null);
            const handlePdfUpload = useCallback(async (event) => {
                if (!pdfLoaded || !window.pdfjsLib) return setError("PDF library not loaded.");
                const file = event.target.files[0];
                if (!file) return;
                setError(null); setPdfFileName(file.name); setPdfData(null);
                try { setPdfData(await file.arrayBuffer()); } catch (err) { setError("Failed to read PDF."); setPdfFileName(''); } finally { if (event.target) event.target.value = null; }
            }, [pdfLoaded]);
            const resetPdfUpload = useCallback(() => { setPdfData(null); setPdfFileName(''); setError(null); }, []);
            return { pdfData, pdfFileName, error, handlePdfUpload, resetPdfUpload, setError };
        };

        const evaluatePipeline = (val, pipelineModuleIds, allModules) => {
            if (!pipelineModuleIds || pipelineModuleIds.length === 0) return String(val || '').trim();
            let currentVal = String(val || '').trim();
            for (const modId of pipelineModuleIds) {
                const module = allModules.find(m => m.id === modId);
                if (!module) continue;
                try {
                    const script = module.code.includes('return') ? module.code : `return ${module.code};`;
                    const fn = new Function('value', script);
                    const result = fn(currentVal);
                    currentVal = result === undefined || result === null ? '' : String(result).trim();
                } catch (e) { return '#ERROR'; }
            }
            return currentVal;
        };

        const usePdfMatcher = () => {
            const [isMatching, setIsMatching] = useState(false);
            const [matches, setMatches] = useState({}); 
            const [progress, setProgress] = useState(0);
            const [statusText, setStatusText] = useState('');

            const runMatching = useCallback(async (pdfData, filteredRows, selectedHeaderIds, headerPipelines, allModules) => {
                if (!pdfData || !filteredRows.length || !selectedHeaderIds.length || !window.pdfjsLib) return;
                setIsMatching(true); setMatches({}); setProgress(0); setStatusText('Scanning PDF Lines...');
                try {
                    const dataCopy = pdfData.slice(0);
                    const doc = await window.pdfjsLib.getDocument({ data: dataCopy }).promise;
                    const numPages = doc.numPages;
                    const newMatches = {};
                    const pageTexts = [];
                    const SCALE = 2.0; 

                    for (let i = 1; i <= numPages; i++) {
                        const page = await doc.getPage(i);
                        const textContent = await page.getTextContent();
                        const viewport = page.getViewport({ scale: SCALE });
                        const lines = [];
                        
                        textContent.items.forEach(item => {
                            if (!item.str || !item.str.trim()) return; 
                            const tx = item.transform[4]; const ty = item.transform[5];
                            const w = item.width; const h = item.height || 12;
                            const [x0, y0] = viewport.convertToViewportPoint(tx, ty + h);
                            const [x1, y1] = viewport.convertToViewportPoint(tx + w, ty);
                            const line = lines.find(l => Math.abs(l.y - y1) < 5);
                            const mappedItem = { text: item.str, x0: Math.min(x0, x1), y0: Math.min(y0, y1), x1: Math.max(x0, x1), y1: Math.max(y0, y1) };
                            if (line) {
                                line.items.push(mappedItem);
                                line.minY = Math.min(line.minY, mappedItem.y0); line.maxY = Math.max(line.maxY, mappedItem.y1);
                                line.minX = Math.min(line.minX, mappedItem.x0); line.maxX = Math.max(line.maxX, mappedItem.x1);
                            } else {
                                lines.push({ y: y1, minY: mappedItem.y0, maxY: mappedItem.y1, minX: mappedItem.x0, maxX: mappedItem.x1, items: [mappedItem] });
                            }
                        });
                        
                        lines.forEach(l => {
                            l.items.sort((a, b) => a.x0 - b.x0);
                            l.fullText = l.items.map(i => i.text).join('').toLowerCase(); 
                        });
                        pageTexts.push({ pageNumber: i, lines });
                        setProgress(Math.round((i / numPages) * 50));
                    }

                    setStatusText('Applying Strict Row Matching...');
                    let processedRows = 0;
                    
                    for (const row of filteredRows) {
                        const searchTargets = selectedHeaderIds.map(id => {
                            const computedVal = evaluatePipeline(row[id], headerPipelines[id], allModules);
                            return computedVal === '#ERROR' ? '' : computedVal.toLowerCase();
                        }).filter(val => val.length > 0); 

                        const hasStrongTarget = searchTargets.some(t => t.replace(/\s+/g, '').length > 3);

                        if (searchTargets.length > 0 && hasStrongTarget) {
                            let foundMatch = null;
                            for (const { pageNumber, lines } of pageTexts) {
                                for (const line of lines) {
                                    const lineTextNoSpace = line.fullText.replace(/\s+/g, '');
                                    const allFound = searchTargets.every(target => lineTextNoSpace.includes(target.replace(/\s+/g, '')));
                                    if (allFound) {
                                        foundMatch = { pageNum: pageNumber, boundingBox: { x: line.minX - 4, y: line.minY - 4, w: (line.maxX - line.minX) + 8, h: (line.maxY - line.minY) + 8, sourceScale: SCALE } };
                                        break; 
                                    }
                                }
                                if (foundMatch) break;
                            }
                            if (foundMatch) newMatches[row.id] = foundMatch;
                        }
                        processedRows++;
                        setProgress(50 + Math.round((processedRows / filteredRows.length) * 50));
                    }
                    setMatches(newMatches);
                } catch (err) { console.error(err); } finally { setIsMatching(false); setProgress(100); setStatusText(''); }
            }, []);
            return { runMatching, isMatching, matches, progress, statusText };
        };

        const PdfPage = ({ doc, pageNum, highlights, activeRowId }) => {
            const canvasRef = useRef(null);
            const containerRef = useRef(null);
            const [renderData, setRenderData] = useState(null);

            useEffect(() => {
                let renderTask = null;
                const renderPage = async () => {
                    if (!doc || !canvasRef.current) return;
                    try {
                        const page = await doc.getPage(pageNum);
                        const scale = 1.2; 
                        const viewport = page.getViewport({ scale });
                        const canvas = canvasRef.current;
                        const context = canvas.getContext('2d');
                        canvas.height = viewport.height;
                        canvas.width = viewport.width;
                        renderTask = page.render({ canvasContext: context, viewport });
                        await renderTask.promise;
                        setRenderData({ viewport, scale });
                    } catch (err) { if (err.name !== 'RenderingCancelledException') console.error(err); }
                };
                renderPage();
                return () => { if (renderTask) renderTask.cancel(); };
            }, [doc, pageNum]);
            // Scroll this page into view if it contains the actively clicked highlight
            useEffect(() => {
                if (activeRowId && highlights?.some(h => h.rowId === activeRowId)) {
                    containerRef.current?.scrollIntoView({ behavior: 'smooth', block: 'center' });
                }
            }, [activeRowId, highlights]);

            return (
                <Box ref={containerRef} sx={{ position: 'relative', mb: 2, boxShadow: 3, bgcolor: 'white', mx: 'auto', width: 'max-content' }}>
                    <canvas ref={canvasRef} style={{ display: 'block' }} />
                    {renderData && highlights?.map((hl, idx) => {
                        const { scale } = renderData;
                        const { x, y, w, h, sourceScale } = hl.boundingBox;
                        const ratio = scale / sourceScale;
                        const isActive = hl.rowId === activeRowId;
                        return (
                            <div key={idx} style={{
                                position: 'absolute',
                                left: `${x * ratio}px`, top: `${y * ratio}px`, width: `${w * ratio}px`, height: `${h * ratio}px`,
                                border: isActive ? '3px solid rgba(244, 67, 54, 0.9)' : '2px solid rgba(255, 193, 7, 0.7)',
                                backgroundColor: isActive ? 'rgba(244, 67, 54, 0.25)' : 'rgba(255, 193, 7, 0.25)',
                                pointerEvents: 'none', borderRadius: '4px',
                                boxShadow: isActive ? '0 0 15px rgba(244, 67, 54, 0.7)' : 'none',
                                zIndex: isActive ? 10 : 5, transition: 'all 0.3s ease'
                            }} />
                        );
                    })}
                </Box>
            );
        };

        const PdfViewer = ({ pdfData, matches, activeMatchRowId }) => {
            const [doc, setDoc] = useState(null);
            const [numPages, setNumPages] = useState(0);

            useEffect(() => {
                const loadPdf = async () => {
                    if (!pdfData || !window.pdfjsLib) return;
                    try {
                        const dataCopy = pdfData.slice(0);
                        const loadedDoc = await window.pdfjsLib.getDocument({ data: dataCopy }).promise;
                        setDoc(loadedDoc); setNumPages(loadedDoc.numPages);
                    } catch(e) { console.error(e); }
                };
                loadPdf();
            }, [pdfData]);

            const highlightsByPage = useMemo(() => {
                const map = {};
                Object.entries(matches).forEach(([rowId, match]) => {
                    if (!map[match.pageNum]) map[match.pageNum] = [];
                    map[match.pageNum].push({ rowId, boundingBox: match.boundingBox });
                });
                return map;
            }, [matches]);

            if (!pdfData) return <Typography color="text.secondary">No PDF uploaded</Typography>;
            if (numPages === 0) return <CircularProgress size={24} sx={{ display: 'block', margin: 'auto', mt: 4 }} />;

            return (
                <Box sx={{ overflow: 'auto', maxHeight: '70vh', border: '1px solid #ddd', borderRadius: 1, bgcolor: '#9e9e9e', p: 2 }}>
                    {Array.from({ length: numPages }).map((_, i) => (
                        <PdfPage key={i + 1} doc={doc} pageNum={i + 1} highlights={highlightsByPage[i + 1] || []} activeRowId={activeMatchRowId} />
                    ))}
                </Box>
            );
        };

        function App() {
            const { loaded: xlsxLoaded, error: xlsxError } = useScript('https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js');
            const { loaded: pdfLoaded, error: pdfJsError } = useScript('https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js');
            const { loaded: pdfLibLoaded } = useScript('https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js');

            useEffect(() => {
                if (pdfLoaded && window.pdfjsLib) window.pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
            }, [pdfLoaded]);

            const { workbook, sheetNames, fileName, error: uploadError, loading: uploadLoading, handleFileUpload, resetUpload, setError: setUploadError } = useExcelUploader(xlsxLoaded);
            const [selectedSheet, setSelectedSheet] = useState('');
            const { suggestedRange, customRange, headers, rows, handleRangeChange, error: sheetError } = useSheetData(workbook, selectedSheet);
            
            const [filters, setFilters] = useState({});
            const filteredRows = useFilteredData(rows, filters);

            const { modules, addModule, deleteModule, exportModules, importModules } = useFormattingModules();
            const { selectedHeaderIds, handleHeaderSelectionChange, headerPipelines, addModuleToPipeline, removeModuleFromPipeline } = useHeaderSelection();
            const [isModuleManagerOpen, setIsModuleManagerOpen] = useState(false);
            const [newModuleName, setNewModuleName] = useState('');
            const [newModuleCode, setNewModuleCode] = useState('return value;');
            const moduleImportRef = useRef(null);

            const { pdfData, pdfFileName, handlePdfUpload, resetPdfUpload, error: pdfUploadError } = usePdfUploader(pdfLoaded);
            const { runMatching, isMatching, matches, progress, statusText } = usePdfMatcher();

            useEffect(() => {
                if (pdfData && filteredRows.length > 0 && selectedHeaderIds.length > 0) {
                    const timer = setTimeout(() => { runMatching(pdfData, filteredRows, selectedHeaderIds, headerPipelines, modules); }, 800);
                    return () => clearTimeout(timer);
                }
            }, [pdfData, filteredRows, selectedHeaderIds, headerPipelines, modules, runMatching]);

            const displayColumns = useMemo(() => {
                const cols = [];
                headers.forEach(header => {
                    cols.push({ ...header, isOriginal: true });
                    if (selectedHeaderIds.includes(header.id)) {
                        cols.push({ ...header, id: `${header.id}_computed`, originalId: header.id, isComputed: true, label: `${header.label} (Formatted)` });
                    }
                });
                return cols;
            }, [headers, selectedHeaderIds]);

            const [activeMatchRowId, setActiveMatchRowId] = useState(null); 
            const fileInputRef = useRef(null);
            const pdfInputRef = useRef(null);

            const handleFilterChange = (colId, value) => setFilters(prev => ({ ...prev, [colId]: value }));
            const handleCloseError = () => { if (uploadError) setUploadError(null); };

            useEffect(() => {
                if (sheetNames && sheetNames.length > 0) setSelectedSheet(sheetNames[0]);
                else setSelectedSheet('');
            }, [sheetNames]);

            useEffect(() => { setFilters({}); setActiveMatchRowId(null); }, [selectedSheet, customRange]);

            const handleExportExcel = () => {
                if (!window.XLSX || !filteredRows.length) return;
                const exportData = filteredRows.map(row => {
                    const rowData = {};
                    headers.forEach(h => { rowData[h.label] = row[h.id]; });
                    selectedHeaderIds.forEach(id => {
                        const h = headers.find(h => h.id === id);
                        if (h) rowData[`${h.label} (Formatted)`] = evaluatePipeline(row[id], headerPipelines[id], modules);
                    });
                    const match = matches[row.id];
                    rowData['PDF Match Found'] = match ? `Yes (Page ${match.pageNum})` : 'No';
                    return rowData;
                });
                const ws = window.XLSX.utils.json_to_sheet(exportData);
                const wb = window.XLSX.utils.book_new();
                window.XLSX.utils.book_append_sheet(wb, ws, "Matched Results");
                window.XLSX.writeFile(wb, "Cross_Referenced_Data.xlsx");
            };

            const handleExportPdf = async () => {
                if (!window.PDFLib || !pdfData || Object.keys(matches).length === 0) return;
                try {
                    const { PDFDocument, rgb } = window.PDFLib;
                    const pdfDoc = await PDFDocument.load(pdfData);
                    Object.values(matches).forEach(match => {
                        const { pageNum, boundingBox } = match;
                        const page = pdfDoc.getPage(pageNum - 1);
                        const { height } = page.getSize();
                        const { x, y, w, h, sourceScale } = boundingBox;
                        page.drawRectangle({
                            x: x / sourceScale, y: height - (y / sourceScale) - (h / sourceScale),
                            width: w / sourceScale, height: h / sourceScale,
                            borderColor: rgb(1, 0, 0), borderWidth: 2, color: rgb(1, 0, 0), opacity: 0.2, borderOpacity: 0.8
                        });
                    });
                    const pdfBytes = await pdfDoc.save();
                    const blob = new Blob([pdfBytes], { type: 'application/pdf' });
                    const link = document.createElement('a');
                    link.href = URL.createObjectURL(blob); link.download = 'Annotated_Matches.pdf';
                    document.body.appendChild(link); link.click(); document.body.removeChild(link);
                } catch (err) { setUploadError('Failed to generate PDF.'); }
            };

            const activeError = uploadError || sheetError || pdfUploadError || (xlsxError ? "Excel library failed." : null) || (pdfJsError ? "PDF library failed." : null);

            return (
                <ThemeProvider theme={theme}>
                    <CssBaseline />
                    <Box sx={{ minHeight: '100vh', py: 4, bgcolor: 'background.default' }}>
                        <Container maxWidth="xl">
                            <Box sx={{ mb: 4, textAlign: 'center' }}>
                                <Typography variant="h3" component="h1" gutterBottom sx={{ fontWeight: 'bold', color: 'primary.main' }}>
                                    Excel to PDF Cross-Referencer
                                </Typography>
                                <Typography variant="subtitle1" color="text.secondary">
                                    Filter Excel rows, map specific columns, and automatically locate their exact matches in PDF layouts.
                                </Typography>
                            </Box>

                            <Paper elevation={3} sx={{ p: { xs: 2, md: 4 }, borderRadius: 2, mb: 4 }}>
                                <Grid container spacing={4}>
                                    <Grid item xs={12} md={6}>
                                        <Box sx={{ display: 'flex', flexDirection: 'column', gap: 2, p: 2, border: '1px solid #e0e0e0', borderRadius: 2 }}>
                                            <Typography variant="h6">1. Upload Excel Data</Typography>
                                            <input type="file" accept=".xlsx, .xls, .csv" style={{ display: 'none' }} ref={fileInputRef} onChange={handleFileUpload} />
                                            {!fileName ? (
                                                <Button variant="outlined" color="primary" startIcon={<Icon name="upload" />} onClick={() => fileInputRef.current?.click()} disabled={uploadLoading || !xlsxLoaded} fullWidth sx={{ py: 1.5 }}>
                                                    {uploadLoading ? 'Uploading...' : 'Select Excel File'}
                                                </Button>
                                            ) : (
                                                <Box sx={{ display: 'flex', alignItems: 'center', gap: 1, p: 1.5, border: '1px solid', borderColor: 'success.main', borderRadius: 1, bgcolor: 'success.50' }}>
                                                    <Icon name="check-circle" color="green" />
                                                    <Typography variant="body2" sx={{ flexGrow: 1, overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>{fileName}</Typography>
                                                    <IconButton size="small" onClick={resetUpload} color="error" title="Remove file"><Icon name="refresh-ccw" size={18} /></IconButton>
                                                </Box>
                                            )}

                                            {fileName && (
                                                <Grid container spacing={2}>
                                                    <Grid item xs={12} sm={6}>
                                                        <FormControl fullWidth size="small">
                                                            <InputLabel shrink>Select Sheet</InputLabel>
                                                            <Select native value={selectedSheet} onChange={(e) => setSelectedSheet(e.target.value)} label="Select Sheet">
                                                                <option value="" disabled>Select...</option>
                                                                {sheetNames.map((name) => <option key={name} value={name}>{name}</option>)}
                                                            </Select>
                                                        </FormControl>
                                                        <Box sx={{ mt: 2, display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
                                                            <Typography variant="body2" color="text.secondary" sx={{ fontWeight: 'bold' }}>Formatting Pipeline</Typography>
                                                            <Button size="small" startIcon={<Icon name="settings" size={14} />} onClick={() => setIsModuleManagerOpen(true)}>Manage Modules</Button>
                                                        </Box>
                                                        {selectedHeaderIds.length > 0 && (
                                                            <Box sx={{ display: 'flex', flexDirection: 'column', gap: 1.5, p: 1.5, mt: 1, bgcolor: 'grey.50', borderRadius: 1, border: '1px solid #eee' }}>
                                                                {selectedHeaderIds.map(id => {
                                                                    const header = headers.find(h => h.id === id);
                                                                    const currentPipeline = headerPipelines[id] || [];
                                                                    return (
                                                                        <Box key={id} sx={{ p: 1, border: '1px solid #ddd', borderRadius: 1, bgcolor: 'white' }}>
                                                                            <Typography variant="subtitle2" sx={{ mb: 1, color: 'primary.dark' }}>{header?.label}</Typography>
                                                                            {currentPipeline.length > 0 && (
                                                                                <Box sx={{ display: 'flex', flexWrap: 'wrap', gap: 1, mb: 1.5 }}>
                                                                                    {currentPipeline.map((modId, index) => {
                                                                                        const mod = modules.find(m => m.id === modId);
                                                                                        return <Chip key={`${modId}-${index}`} label={mod ? mod.name : 'Unknown Module'} size="small" color="primary" variant="outlined" onDelete={() => removeModuleFromPipeline(id, index)} />;
                                                                                    })}
                                                                                </Box>
                                                                            )}
                                                                            <FormControl size="small" fullWidth>
                                                                                <Select displayEmpty value="" onChange={(e) => addModuleToPipeline(id, e.target.value)} sx={{ '& .MuiSelect-select': { py: 0.5, fontSize: '0.8rem' } }}>
                                                                                    <MenuItem value="" disabled><em>+ Add Step...</em></MenuItem>
                                                                                    {modules.map(mod => <MenuItem key={mod.id} value={mod.id} sx={{ fontSize: '0.8rem' }}>{mod.name}</MenuItem>)}
                                                                                </Select>
                                                                            </FormControl>
                                                                        </Box>
                                                                    );
                                                                })}
                                                            </Box>
                                                        )}
                                                    </Grid>
                                                    <Grid item xs={12} sm={6}>
                                                        <TextField fullWidth size="small" label="Data Range" value={customRange} onChange={(e) => handleRangeChange(e.target.value)} helperText={suggestedRange ? `Auto: ${suggestedRange}` : ''} InputLabelProps={{ shrink: true }} />
                                                    </Grid>
                                                </Grid>
                                            )}
                                        </Box>
                                    </Grid>

                                    <Grid item xs={12} md={6}>
                                        <Box sx={{ display: 'flex', flexDirection: 'column', gap: 2, p: 2, border: '1px solid #e0e0e0', borderRadius: 2, opacity: fileName && selectedSheet ? 1 : 0.5, pointerEvents: fileName && selectedSheet ? 'auto' : 'none' }}>
                                            <Typography variant="h6">2. Configure PDF Matcher</Typography>
                                            <input type="file" accept="application/pdf" style={{ display: 'none' }} ref={pdfInputRef} onChange={handlePdfUpload} />
                                            {!pdfFileName ? (
                                                <Button variant="outlined" color="secondary" startIcon={<Icon name="file-text" />} onClick={() => pdfInputRef.current?.click()} disabled={!pdfLoaded} fullWidth sx={{ py: 1.5 }}>
                                                    Upload Target PDF
                                                </Button>
                                            ) : (
                                                <Box sx={{ display: 'flex', alignItems: 'center', gap: 1, p: 1.5, border: '1px solid', borderColor: 'secondary.main', borderRadius: 1, bgcolor: '#e3f2fd' }}>
                                                    <Icon name="check-circle" color="#1976d2" />
                                                    <Typography variant="body2" sx={{ flexGrow: 1, overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>{pdfFileName}</Typography>
                                                    <IconButton size="small" onClick={resetPdfUpload} color="error" title="Remove file"><Icon name="refresh-ccw" size={18} /></IconButton>
                                                </Box>
                                            )}

                                            <FormControl fullWidth size="small" disabled={headers.length === 0}>
                                                <InputLabel id="header-select-label">Select Columns to Search in PDF</InputLabel>
                                                <Select labelId="header-select-label" multiple value={selectedHeaderIds} onChange={handleHeaderSelectionChange} input={<OutlinedInput label="Select Columns to Search in PDF" />} renderValue={(selected) => (
                                                    <Box sx={{ display: 'flex', flexWrap: 'wrap', gap: 0.5 }}>
                                                        {selected.map((value) => {
                                                            const header = headers.find(h => h.id === value);
                                                            return <Chip key={value} label={header ? header.label : value} size="small" />;
                                                        })}
                                                    </Box>
                                                )}>
                                                    {headers.map((header) => (
                                                        <MenuItem key={header.id} value={header.id}><Checkbox checked={selectedHeaderIds.indexOf(header.id) > -1} /><ListItemText primary={header.label} /></MenuItem>
                                                    ))}
                                                </Select>
                                            </FormControl>

                                            <Box sx={{ mt: 1, display: 'flex', flexDirection: 'column', gap: 2 }}>
                                                <Box sx={{ display: 'flex', alignItems: 'center', gap: 2, minHeight: 24 }}>
                                                    {isMatching ? (
                                                        <><CircularProgress size={16} /><Typography variant="body2" color="text.secondary">{statusText} ({progress}%)</Typography></>
                                                    ) : selectedHeaderIds.length > 0 && pdfData ? (
                                                        <Typography variant="body2" color="success.main" sx={{ display: 'flex', alignItems: 'center', gap: 1 }}>
                                                            <Icon name="check-circle" size={16} /> Live matching active. Found {Object.keys(matches).length} exact row matches.
                                                        </Typography>
                                                    ) : (
                                                        <Typography variant="body2" color="text.secondary">Select columns and upload PDF to begin live matching.</Typography>
                                                    )}
                                                </Box>
                                                <Grid container spacing={2}>
                                                    <Grid item xs={6}>
                                                        <Button variant="outlined" color="secondary" fullWidth startIcon={<Icon name="download" size={18} />} onClick={handleExportExcel} disabled={isMatching || Object.keys(matches).length === 0}>
                                                            Export Data (Excel)
                                                        </Button>
                                                    </Grid>
                                                    <Grid item xs={6}>
                                                        <Button variant="outlined" color="primary" fullWidth startIcon={<Icon name="file-text" size={18} />} onClick={handleExportPdf} disabled={isMatching || Object.keys(matches).length === 0 || !pdfLibLoaded}>
                                                            Save PDF (Highlighted)
                                                        </Button>
                                                    </Grid>
                                                </Grid>
                                            </Box>
                                        </Box>
                                    </Grid>
                                </Grid>
                            </Paper>

                            {selectedSheet && headers.length > 0 && (
                                <Grid container spacing={3}>
                                    <Grid item xs={12} lg={7}>
                                        <Paper sx={{ p: 2, height: '100%', display: 'flex', flexDirection: 'column' }}>
                                            <Box sx={{ mb: 2, display: 'flex', alignItems: 'center', gap: 1 }}>
                                                <Icon name="filter" size={24} color="#2e7d32" />
                                                <Typography variant="h6">Data Grid ({filteredRows.length} rows)</Typography>
                                            </Box>

                                            <TableContainer component={Box} sx={{ flexGrow: 1, maxHeight: '65vh', overflowX: 'auto', border: '1px solid #e0e0e0' }}>
                                                <Table stickyHeader size="small" aria-label="data table">
                                                    <TableHead>
                                                        <TableRow>
                                                            {/* New Page Number Column */}
                                                            <TableCell sx={{ minWidth: 100, bgcolor: '#e3f2fd', borderRight: '2px solid #ddd', zIndex: 11, position: 'sticky', left: 0, boxShadow: '2px 0 5px -2px rgba(0,0,0,0.2)' }}>
                                                                <Typography variant="subtitle2" sx={{ fontWeight: 'bold', mb: 1, color: 'secondary.main' }}>
                                                                    PDF Page
                                                                </Typography>
                                                                <Typography variant="caption" color="text.secondary">Matches found</Typography>
                                                            </TableCell>

                                                            {/* Data & Live Preview Columns */}
                                                            {displayColumns.map((col) => (
                                                                <TableCell key={col.id} sx={{ minWidth: col.isComputed ? 180 : 150, bgcolor: col.isComputed ? '#e8f5e9' : '#f5f5f5', verticalAlign: 'top', borderLeft: col.isComputed ? '1px dashed #ccc' : 'none' }}>
                                                                    <Typography variant="subtitle2" sx={{ fontWeight: 'bold', mb: 1, color: col.isComputed ? 'primary.dark' : 'inherit' }}>
                                                                        {col.label}
                                                                        {col.isComputed && <Chip size="small" label="Search Key" color="primary" sx={{ ml: 1, height: 16, fontSize: '0.6rem' }} />}
                                                                    </Typography>
                                                                    {col.isOriginal ? (
                                                                        <TextField size="small" placeholder="Filter..." variant="outlined" fullWidth value={filters[col.id] || ''} onChange={(e) => handleFilterChange(col.id, e.target.value)} sx={{ bgcolor: 'white' }} inputProps={{ style: { fontSize: '0.8rem', padding: '6px 10px' } }} />
                                                                    ) : (
                                                                        <Typography variant="caption" color="primary.main" sx={{ fontStyle: 'italic' }}>Live Formula Preview</Typography>
                                                                    )}
                                                                </TableCell>
                                                            ))}
                                                        </TableRow>
                                                    </TableHead>
                                                    <TableBody>
                                                        {filteredRows.map((row) => {
                                                            const matchData = matches[row.id];
                                                            const isSelected = activeMatchRowId === row.id;

                                                            return (
                                                                <TableRow 
                                                                    hover 
                                                                    key={row.id} 
                                                                    onClick={() => matchData && setActiveMatchRowId(row.id)}
                                                                    sx={{ 
                                                                        cursor: matchData ? 'pointer' : 'default',
                                                                        bgcolor: isSelected ? '#e3f2fd' : 'inherit',
                                                                        '&:hover': { bgcolor: matchData ? '#bbdefb' : 'action.hover' }
                                                                    }}
                                                                >
                                                                    {/* Page Number Cell */}
                                                                    <TableCell sx={{ borderRight: '2px solid #ddd', fontWeight: 'bold', color: matchData ? 'secondary.main' : 'text.disabled', position: 'sticky', left: 0, bgcolor: isSelected ? '#bbdefb' : (matchData ? '#e3f2fd' : '#ffffff'), zIndex: 10, boxShadow: '2px 0 5px -2px rgba(0,0,0,0.2)' }}>
                                                                        {matchData ? (
                                                                            <Box sx={{ display: 'flex', alignItems: 'center', gap: 1 }}>
                                                                                Pg {matchData.pageNum}
                                                                                <Icon name="maximize" size={14} />
                                                                            </Box>
                                                                        ) : '-'}
                                                                    </TableCell>

                                                                    {/* Data Cells */}
                                                                    {displayColumns.map((col) => {
                                                                        let cellValue = '';
                                                                        if (col.isOriginal) {
                                                                            cellValue = row[col.id] || '';
                                                                        } else if (col.isComputed) {
                                                                            cellValue = evaluatePipeline(row[col.originalId], headerPipelines[col.originalId], modules);
                                                                        }
                                                                        const isError = cellValue === '#ERROR';
                                                                        
                                                                        return (
                                                                            <TableCell key={`${row.id}-${col.id}`} sx={{ whiteSpace: 'nowrap', overflow: 'hidden', textOverflow: 'ellipsis', maxWidth: 200, bgcolor: col.isComputed ? '#e8f5e9' : 'inherit', color: isError ? 'error.main' : 'inherit', borderLeft: col.isComputed ? '1px dashed #ccc' : 'none' }}>
                                                                                <Tooltip title={cellValue} placement="top-start" arrow disableInteractive>
                                                                                    <span>{cellValue}</span>
                                                                                </Tooltip>
                                                                            </TableCell>
                                                                        );
                                                                    })}
                                                                </TableRow>
                                                            );
                                                        })}
                                                        {filteredRows.length === 0 && (
                                                            <TableRow><TableCell colSpan={headers.length + 1} align="center" sx={{ py: 4 }}><Typography color="text.secondary">No matching rows.</Typography></TableCell></TableRow>
                                                        )}
                                                    </TableBody>
                                                </Table>
                                            </TableContainer>
                                        </Paper>
                                    </Grid>
                                    
                                    <Grid item xs={12} lg={5}>
                                        <Paper sx={{ p: 2, height: '100%', display: 'flex', flexDirection: 'column' }}>
                                            <Box sx={{ mb: 2, display: 'flex', alignItems: 'center', gap: 1, justifyContent: 'space-between' }}>
                                                <Box sx={{ display: 'flex', alignItems: 'center', gap: 1 }}>
                                                    <Icon name="file-text" size={24} color="#1976d2" />
                                                    <Typography variant="h6">PDF Match Preview</Typography>
                                                </Box>
                                            </Box>
                                            <PdfViewer pdfData={pdfData} matches={matches} activeMatchRowId={activeMatchRowId} />
                                        </Paper>
                                    </Grid>
                                </Grid>
                            )}
                        </Container>
                        
                        <Dialog open={isModuleManagerOpen} onClose={() => setIsModuleManagerOpen(false)} maxWidth="sm" fullWidth>
                            <DialogTitle sx={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
                                Manage Formatting Modules
                                <IconButton onClick={() => setIsModuleManagerOpen(false)} size="small"><Icon name="x" /></IconButton>
                            </DialogTitle>
                            <DialogContent dividers>
                                <Box sx={{ display: 'flex', gap: 2, mb: 3 }}>
                                    <Button variant="outlined" startIcon={<Icon name="download" size={16} />} onClick={exportModules} fullWidth>Export</Button>
                                    <input type="file" accept=".json" style={{ display: 'none' }} ref={moduleImportRef} onChange={importModules} />
                                    <Button variant="outlined" startIcon={<Icon name="upload-cloud" size={16} />} onClick={() => moduleImportRef.current?.click()} fullWidth>Import</Button>
                                </Box>
                                
                                <Typography variant="subtitle2" gutterBottom>Saved Modules</Typography>
                                <List sx={{ mb: 3, border: '1px solid #eee', borderRadius: 1, bgcolor: 'background.paper', maxHeight: 200, overflow: 'auto' }}>
                                    {modules.map((mod) => (
                                        <ListItem key={mod.id} secondaryAction={!mod.id.startsWith('mod_') || mod.id.includes('custom') ? (<IconButton edge="end" onClick={() => deleteModule(mod.id)}><Icon name="trash-2" size={16} color="#d32f2f" /></IconButton>) : null}>
                                            <ListItemText primary={mod.name} secondary={<Typography variant="caption" sx={{ fontFamily: 'monospace', color: 'text.secondary', display: 'block', textOverflow: 'ellipsis', overflow: 'hidden', whiteSpace: 'nowrap' }}>{mod.code}</Typography>} />
                                        </ListItem>
                                    ))}
                                </List>

                                <Typography variant="subtitle2" gutterBottom>Create New Custom Module</Typography>
                                <Box sx={{ display: 'flex', flexDirection: 'column', gap: 2, p: 2, bgcolor: 'grey.50', borderRadius: 1, border: '1px dashed #ccc' }}>
                                    <TextField label="Module Name" size="small" fullWidth placeholder="e.g. Extract Year" value={newModuleName} onChange={(e) => setNewModuleName(e.target.value)} />
                                    <TextField label="JavaScript Code" size="small" fullWidth multiline rows={3} placeholder="return value;" value={newModuleCode} onChange={(e) => setNewModuleCode(e.target.value)} helperText="Input variable is `value`. Must return a string." sx={{ fontFamily: 'monospace' }} />
                                    <Button variant="contained" startIcon={<Icon name="plus" size={16} />} onClick={() => { addModule({ name: newModuleName, code: newModuleCode }); setNewModuleName(''); setNewModuleCode('return value;'); }} disabled={!newModuleName || !newModuleCode}>
                                        Add Module
                                    </Button>
                                </Box>
                            </DialogContent>
                            <DialogActions><Button onClick={() => setIsModuleManagerOpen(false)}>Close</Button></DialogActions>
                        </Dialog>
                        <Snackbar open={!!activeError} autoHideDuration={6000} onClose={handleCloseError} message={activeError} action={<IconButton size="small" color="inherit" onClick={handleCloseError}><Icon name="x" size={20} /></IconButton>} />
                    </Box>
                </ThemeProvider>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
